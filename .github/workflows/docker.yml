name: publish docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Never cancel a run that is mid-push: a cancelled publish leaves the tag
  # pointing at whatever landed last, so a green run would not be the one
  # that shipped. Only coalesce on branches that do not publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # hardcoded, not ${{ github.repository }} — this repo has been renamed
          # once already and the published tag must not move when it happens again
          images: ghcr.io/caffeinum/vibeos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          # build-push-action applies these OVER the Dockerfile's LABELs, so the
          # Dockerfile is not the source of truth for anything listed here.
          # metadata-action defaults image.url to the repo and derives licenses
          # from GitHub's detection, which silently blanked both.
          labels: |
            org.opencontainers.image.url=https://vibeos.sh/?ref=ghcr
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build is not evidence of a multi-arch manifest — issue #13 was a
      # successful push that shipped arm64 only. Assert the published tag really
      # resolves on both platforms before calling the job done.
      - name: verify published manifest is multi-arch
        env:
          IMAGE: ghcr.io/caffeinum/vibeos@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE"

          # The manifest must be a list, and must advertise both platforms.
          published=$(docker buildx imagetools inspect "$IMAGE" --raw |
            jq -r '.manifests[]? | select(.platform.os != "unknown")
                   | "\(.platform.os)/\(.platform.architecture)"' | sort -u)
          echo "published platforms: ${published:-<none — not a manifest list>}"

          for platform in linux/amd64 linux/arm64; do
            grep -qx "$platform" <<<"$published" || {
              echo "::error::$IMAGE does not publish $platform"
              exit 1
            }

            # And it has to actually pull, not just be listed.
            #
            # Pull the per-platform digest, NOT `--platform <p> <index-digest>`.
            # Pulling the same index digest twice with different --platform
            # values fails the second time with "cannot overwrite digest": the
            # local store keys on the digest, so the arm64 pull collides with
            # the amd64 one already stored under it. The image is fine; the
            # check is what breaks. Per-platform digests are distinct, so they
            # coexist.
            digest=$(docker buildx imagetools inspect "$IMAGE" --raw |
              jq -r --arg p "$platform" '.manifests[]
                     | select("\(.platform.os)/\(.platform.architecture)" == $p)
                     | .digest')
            docker pull --quiet "ghcr.io/caffeinum/vibeos@$digest" >/dev/null
          done

      # The tools below are invoked as shell strings from the agent's system
      # prompt (src/app/api/chat/route.ts), so they are invisible to bun install
      # and to dependabot. `npx puppeteer browsers install chrome` failed on
      # arm64 with exit 1 and no output for months while CI stayed green and the
      # image shipped with no browser. Assert they exist, in the running
      # container, as the user the entrypoint actually runs as.
      - name: smoke test shelled-out binaries
        env:
          IMAGE: ghcr.io/caffeinum/vibeos@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"

            # Per-platform digest, for the same reason as the step above: the
            # second `--platform <p> <index-digest>` collides in the local store.
            digest=$(docker buildx imagetools inspect "$IMAGE" --raw |
              jq -r --arg p "$platform" '.manifests[]
                     | select("\(.platform.os)/\(.platform.architecture)" == $p)
                     | .digest')

            # No command argument — this must start the real CMD, so that a
            # daemon dying at startup takes the container down via `wait -n`
            # and is caught by the State.Running check below.
            cid=$(docker run -d --platform "$platform" "ghcr.io/caffeinum/vibeos@$digest")
            trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

            # If the entrypoint died, `docker exec` reports "container not
            # running" and hides the real reason. Surface the logs instead.
            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              echo "::error::[$platform] container exited on startup:"
              docker logs "$cid" || true
              exit 1
            fi

            # uvx: src/server/api/routers/{browser-use,dedalus}.ts spawn it to
            # fetch `browser-use` / `dedalus-labs` from PyPI at first call.
            # NOTE: `uvx --version` proves only that uv is installed. It does
            # NOT prove `browser-use` or `dedalus-labs` resolve from PyPI at
            # first call — those are unpinned and fetched at runtime.
            for probe in "bun --version" "chromium --version" "uvx --version" \
                         "jq --version" "npm --version"; do
              if out=$(docker exec "$cid" sh -lc "$probe" 2>&1); then
                echo "ok: $probe -> $out"
              else
                echo "::error::[$platform] \`$probe\` failed in the built image:"
                echo "$out"
                docker logs "$cid" || true
                exit 1
              fi
            done

            # `mcp --version` and `mcp --help` both exit 0 on an install
            # where dist/ was never built — oclif answers them without loading
            # a command class. `daemon --help` forces the daemon command class
            # to load, which imports dist/, so it fails loudly on exactly the
            # broken install. Don't run `mcp daemon` itself: the CMD already
            # holds its port, and a hang before bind is indistinguishable from
            # healthy-and-serving.
            if out=$(docker exec "$cid" sh -lc \
                  '/app/node_modules/.bin/mcp daemon --help' 2>&1); then
              echo "ok: mcp daemon command class loads"
            else
              echo "::error::[$platform] \`mcp daemon --help\` failed — dist/ is probably missing:"
              echo "$out"
              exit 1
            fi


            # The local CDP port must be bound to loopback ONLY. An
            # unauthenticated CDP endpoint is equivalent to remote code
            # execution and can navigate file:// to read this container's
            # filesystem, so a wildcard bind would expose the host the moment
            # anyone published the port.
            #
            # chromium is passed --remote-debugging-address=127.0.0.1, but a
            # flag only states intent: this is what enforces it. A comment
            # cannot, and a chromium default could change silently.
            #
            # Read from /proc/net/tcp rather than `ss`: iproute2 is not in the
            # image, and a probe that needs a missing binary fails as a false
            # red on a healthy image. 2406 is hex for 9222; 0100007F is
            # 127.0.0.1 little-endian, 00000000 is the wildcard bind.
            for attempt in $(seq 1 15); do
              line=$(docker exec "$cid" sh -lc 'grep -i ":2406 " /proc/net/tcp || true')
              if [ -n "$line" ]; then break; fi
              sleep 2
            done
            if [ -z "$line" ]; then
              echo "::error::[$platform] nothing is listening on 9222 — chromium never came up:"
              docker exec "$cid" sh -lc 'cat /proc/1/fd/2' 2>/dev/null || true
              docker logs "$cid" 2>&1 | tail -30 || true
              exit 1
            fi
            if ! echo "$line" | awk '{print $2}' | grep -qi '^0100007F:2406$'; then
              echo "::error::[$platform] CDP port is NOT bound to loopback:"
              echo "$line"
              exit 1
            fi
            echo "ok: CDP bound to 127.0.0.1:9222 only"

            docker rm -f "$cid" >/dev/null
            trap - EXIT
            echo "::endgroup::"
          done
